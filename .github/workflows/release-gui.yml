name: Release GUI

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run automated tests
        shell: pwsh
        run: |
          python -m pytest tests -q

      - name: Build Web GUI executable
        shell: pwsh
        run: |
          ./build_gui_exe.bat

      - name: Build Flet executable
        shell: pwsh
        run: |
          ./build_flet_exe.bat

      - name: Build PySide6 executable
        shell: pwsh
        run: |
          ./build_pyside_exe.bat

      - name: Prepare release artifacts
        id: artifact_meta
        shell: pwsh
        run: |
          $webExePath = "dist/TradutorASS-GUI/TradutorASS-GUI.exe"
          $fletExePath = "dist_flet/TradutorASS-Flet.exe"
          $pysideExePath = "dist_pyside/TradutorASS-PySide.exe"

          foreach ($artifactPath in @($webExePath, $fletExePath, $pysideExePath)) {
            if (-not (Test-Path -LiteralPath $artifactPath -PathType Leaf)) {
              throw "Artefato nao encontrado em: $artifactPath"
            }
          }

          $tag = "desktop-v$(Get-Date -Format 'yyyy.MM.dd-HHmm')-${{ github.run_number }}"
          $releaseName = "Desktop Release $(Get-Date -Format 'yyyy-MM-dd HH:mm') #${{ github.run_number }}"
          $webZipPath = "TradutorASS-Web-$tag.zip"
          $checksumPath = "TradutorASS-$tag.sha256"

          Compress-Archive -Path "dist/TradutorASS-GUI/*" -DestinationPath $webZipPath -Force

          $webZipHash = (Get-FileHash -LiteralPath $webZipPath -Algorithm SHA256).Hash.ToLower()
          $fletHash = (Get-FileHash -LiteralPath $fletExePath -Algorithm SHA256).Hash.ToLower()
          $pysideHash = (Get-FileHash -LiteralPath $pysideExePath -Algorithm SHA256).Hash.ToLower()
          $checksumLines = @(
            "$webZipHash  $webZipPath"
            "$fletHash  TradutorASS-Flet.exe"
            "$pysideHash  TradutorASS-PySide.exe"
          )
          Set-Content -LiteralPath $checksumPath -Value $checksumLines -Encoding ascii

          "web_zip_hash=$webZipHash" >> $env:GITHUB_OUTPUT
          "flet_hash=$fletHash" >> $env:GITHUB_OUTPUT
          "pyside_hash=$pysideHash" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "release_name=$releaseName" >> $env:GITHUB_OUTPUT
          "web_zip_path=$webZipPath" >> $env:GITHUB_OUTPUT
          "checksum_path=$checksumPath" >> $env:GITHUB_OUTPUT

      - name: Get latest release tag
        id: latest_release
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const { data } = await github.rest.repos.getLatestRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("tag", data.tag_name || "");
            } catch (error) {
              if (error.status === 404) {
                core.setOutput("tag", "");
              } else {
                throw error;
              }
            }

      - name: Generate release notes
        shell: pwsh
        run: |
          $prevTag = "${{ steps.latest_release.outputs.tag }}"
          $commitLines = @()
          $changeLines = @()

          if ($prevTag) {
            $range = "$prevTag..HEAD"
            $commitLines = git log --pretty=format:"- %h %s" $range
            $changeLines = git diff --name-status $range
          } else {
            $commitLines = git log -n 20 --pretty=format:"- %h %s"
            $changeLines = git show --name-status --pretty="" HEAD
          }

          if (-not $commitLines) {
            $commitLines = @("- Sem commits para resumir.")
          }

          $added = New-Object System.Collections.Generic.List[string]
          $removed = New-Object System.Collections.Generic.List[string]
          $modified = New-Object System.Collections.Generic.List[string]

          foreach ($line in $changeLines) {
            if (-not $line) { continue }
            $parts = $line -split "`t", 2
            if ($parts.Count -lt 2) { continue }
            $status = $parts[0]
            $file = $parts[1]

            if ($status -match "^A") {
              $added.Add($file)
            } elseif ($status -match "^D") {
              $removed.Add($file)
            } else {
              $modified.Add($file)
            }
          }

          function Format-Section([string]$title, [System.Collections.Generic.List[string]]$items) {
            if ($items.Count -eq 0) {
              return "### $title`n- Nenhum"
            }
            $lines = $items | ForEach-Object { "- $_" }
            return "### $title`n" + ($lines -join "`n")
          }

          $summaryAdded = Format-Section -title "Adicionado" -items $added
          $summaryRemoved = Format-Section -title "Removido" -items $removed
          $summaryModified = Format-Section -title "Alterado" -items $modified
          $commitSummary = ($commitLines -join "`n")
          $webZipHash = "${{ steps.artifact_meta.outputs.web_zip_hash }}"
          $fletHash = "${{ steps.artifact_meta.outputs.flet_hash }}"
          $pysideHash = "${{ steps.artifact_meta.outputs.pyside_hash }}"
          $generatedAt = (Get-Date -Format "yyyy-MM-dd HH:mm:ss K")

          $notes = @"
          ## Resumo da versao (automatizado)

          $summaryAdded

          $summaryRemoved

          $summaryModified

          ## Commits
          $commitSummary

          ## Build
          - Interface Web (ZIP): SHA256 $webZipHash
          - Interface Flet (EXE): SHA256 $fletHash
          - Interface PySide6 (EXE): SHA256 $pysideHash
          - Gerado em: $generatedAt
          "@

          Set-Content -LiteralPath "release_notes.md" -Value $notes -Encoding UTF8

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.artifact_meta.outputs.tag }}
          name: ${{ steps.artifact_meta.outputs.release_name }}
          body_path: release_notes.md
          files: |
            ${{ steps.artifact_meta.outputs.web_zip_path }}
            dist_flet/TradutorASS-Flet.exe
            dist_pyside/TradutorASS-PySide.exe
            ${{ steps.artifact_meta.outputs.checksum_path }}
          draft: false
          prerelease: false
